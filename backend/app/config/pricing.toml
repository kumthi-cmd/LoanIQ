# =============================================================================
# pricing.toml: the price file's settings (Step 6a).
#
# BUSINESS: a desk prices every slot from a price file: what each TBA coupon is
#   worth today, plus what each spec story adds on top (the pay-up). Real desks
#   buy that file from a dealer or a data vendor. LoanIQ has no paid feed, so it
#   builds an illustrative one from free public data:
#     1. the U.S. Treasury's daily par yield curve, fetched once a day   [treasury]
#     2. a current coupon per product = a Treasury yield + a spread      [[product]]
#     3. a price for every coupon from its gap to that current coupon    [[product]]
#     4. a pay-up for every spec story, scaled by an S-curve in the gap  [payup_curve]
#        (each story's full pay-up lives in spec_stories.toml)
#     5. the Current delivery month from SIFMA's settlement calendar     [settlement]
#        and the drop to the next month (Step 6b)                         [drop]
#   The coupon ladder uses slotting.toml's coupon_step_pct, so slots and prices
#   share one step. A price file for any date is rebuilt from that date's curve
#   plus this file, so nothing is stored on disk.
#   ALL SPREADS, DURATIONS, CAPS, BANDS AND PRICES ARE ILLUSTRATIVE. Sources:
#   docs/public-sources.md (Treasury); the model's numbers are listed there
#   under "Rules without a recorded source". Why: docs/decisions.md, 2026-11-27.
#
# TECH: TOML, read by app/pricing/config.py (load_pricing_config) with Python's
#   built-in tomllib and checked when the app starts: an unknown key, a product
#   whose agency or term slotting does not know, or an unknown Treasury tenor
#   stops the app. Rates and spreads in percent; prices in points (100 = par).
# =============================================================================

[source]
# BUSINESS: where prices come from. "model" builds them from the Treasury curve
#   (below). "file" (a desk's own price file) and "vendor" (a data feed) are
#   placeholders for later steps: choosing them today makes /api/prices/grid
#   answer "not configured" (HTTP 503).
active = "model"

[treasury]
# BUSINESS: the daily anchor, the U.S. Treasury's Daily Treasury Par Yield Curve
#   Rates, published as XML once a day after the market closes. Free and public
#   (home.treasury.gov/treasury-daily-interest-rate-xml-feed).
# TECH: the feed serves one calendar month per request; app/pricing/treasury.py
#   adds data=<data> and field_tdr_date_value_month=<YYYYMM> to this URL.
url = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml"
data = "daily_treasury_yield_curve"
# BUSINESS: the desk's day starts and ends in New York. The first request after
#   midnight New York time fetches that day's curve; later requests reuse it.
timezone = "America/New_York"
# TECH: give up on Treasury after this many seconds, and refuse a reply bigger
#   than max_bytes (a month is about 27 KB).
timeout_seconds = 5
max_bytes = 2000000
# TECH: when Treasury cannot be reached, wait this long before trying again, so
#   every request in an outage does not wait out the timeout.
retry_minutes = 30

[grid]
# BUSINESS: the delivery months shown: one "Current" column. Which month Current
#   is rolls with SIFMA's calendar ([settlement]); the next month is shown as the
#   drop ([drop]), not as a second price column.
months = ["Current"]
# BUSINESS: the coupon ladder, in percent: 1.0 to 13.0 in slotting.toml's
#   coupon_step_pct (0.5) gives 25 coupons, wide enough for every note rate on
#   the tape. Coupons far from today's market are flagged model_only (below).
coupon_min_pct = 1.0
coupon_max_pct = 13.0
# BUSINESS: TBA prices are quoted in 32nds of a point, often to a half 32nd
#   ("101-23+" = 101 + 23.5/32). Prices and pay-ups are rounded to this
#   increment, in 32nds.
price_increment_32nds = 0.5
# BUSINESS: the lowest price the model shows, in points. The straight-line
#   discount rule would otherwise reach silly prices on deep-discount coupons
#   no one trades. ILLUSTRATIVE.
floor_price_pts = 40.0

[payup_curve]
# BUSINESS: why a pay-up depends on the coupon. A spec story is worth paying up
#   for because its loans prepay slowly. That matters on premium coupons, where
#   borrowers can refinance and a fast payoff returns par on a bond bought above
#   par. On discount coupons nobody can refinance, so slow prepayment is worth
#   little. The pay-up therefore follows an S-curve in the gap
#   (coupon - current coupon, percent):
#     multiplier m = 0                       when gap <= start_gap_pct
#     m = 3t^2 - 2t^3, t = (gap - start) / (full - start)   in between
#     m = 1                                  when gap >= full_gap_pct
#     pay-up at a coupon (32nds) = story's payup_32nds x m
#   The drop's prepayment speed ([drop]) uses the same m: both follow how much a
#   borrower gains by refinancing, so the shape is defined once, here.
#   ILLUSTRATIVE: the shape is industry practice; no public source is recorded.
start_gap_pct = -1.0
full_gap_pct = 1.0

# -----------------------------------------------------------------------------
# One [[product]] per price-grid row.
# BUSINESS: each row is one agency and term, matching a slot ("UMBS 30Y").
#   current coupon (percent) = Treasury yield at anchor_tenor + spread_pct
#   price below it (points) = 100 - duration_pts_per_pct x (current coupon - coupon)
#   price above it (points) = 100 + premium_cap_pts x (1 - e^(-D x gap / cap))
#     where D = duration_pts_per_pct and gap = coupon - current coupon. It leaves
#     par at the same slope as the discount side, then flattens toward
#     100 + premium_cap_pts: the prepayment cap, because borrowers refinance a
#     high-coupon loan and investors will not pay far above par for a bond that
#     may be repaid at par.
#   traded band: coupons from current coupon - traded_below_pct to current coupon
#     + traded_above_pct are actively traded; the rest are flagged model_only.
#   30-year pools key off the 10-year Treasury, 20-year off the 7-year and
#   15-year off the 5-year, because a mortgage pays back much sooner than its
#   final maturity. GNMA II spreads are a little tighter (government-backed).
#   ALL SPREADS, DURATIONS, CAPS AND BANDS ARE ILLUSTRATIVE; no public source is
#   recorded (docs/public-sources.md, "Rules without a recorded source").
#   sifma_class: the SIFMA settlement class whose calendar the product delivers
#   on ([settlement] below). SIFMA's key: Class A = 30-year UMBS; Class B = 15-year
#   UMBS and 15-year Ginnie Mae; Class C = 30-year Ginnie Mae. SIFMA does not list
#   20-year pools; LoanIQ settles them with the 15-years in Class B, which has no
#   recorded source (docs/public-sources.md, "Rules without a recorded source").
# TECH: agency must be in slotting.toml [agencies] and term in [products];
#   anchor_tenor one of the feed's tenors (1M ... 30Y, see app/pricing/treasury.py);
#   sifma_class one of the classes under [settlement].
# -----------------------------------------------------------------------------

[[product]]
name = "UMBS 30"
sifma_class = "A"
agency = "UMBS"
term = "30Y"
anchor_tenor = "10Y"
spread_pct = 1.35
duration_pts_per_pct = 6.0
premium_cap_pts = 5.0
traded_below_pct = 4.0
traded_above_pct = 2.0

[[product]]
name = "UMBS 20"
sifma_class = "B"
agency = "UMBS"
term = "20Y"
anchor_tenor = "7Y"
spread_pct = 1.20
duration_pts_per_pct = 5.0
premium_cap_pts = 4.0
traded_below_pct = 3.0
traded_above_pct = 1.5

[[product]]
name = "UMBS 15"
sifma_class = "B"
agency = "UMBS"
term = "15Y"
anchor_tenor = "5Y"
spread_pct = 1.00
duration_pts_per_pct = 4.0
premium_cap_pts = 3.0
traded_below_pct = 3.0
traded_above_pct = 1.5

[[product]]
name = "GNMA II 30"
sifma_class = "C"
agency = "GNMA II"
term = "30Y"
anchor_tenor = "10Y"
spread_pct = 1.25
duration_pts_per_pct = 6.0
premium_cap_pts = 5.0
traded_below_pct = 4.0
traded_above_pct = 2.0

[[product]]
name = "GNMA II 20"
sifma_class = "B"
agency = "GNMA II"
term = "20Y"
anchor_tenor = "7Y"
spread_pct = 1.10
duration_pts_per_pct = 5.0
premium_cap_pts = 4.0
traded_below_pct = 3.0
traded_above_pct = 1.5

[[product]]
name = "GNMA II 15"
sifma_class = "B"
agency = "GNMA II"
term = "15Y"
anchor_tenor = "5Y"
spread_pct = 0.90
duration_pts_per_pct = 4.0
premium_cap_pts = 3.0
traded_below_pct = 3.0
traded_above_pct = 1.5

# -----------------------------------------------------------------------------
# The drop (Step 6b)
# BUSINESS: the drop is how much cheaper the next delivery month trades than
#   Current: what a holder earns or pays by keeping the bonds one month longer
#   instead of delivering them now (the carry). In points per $100 face:
#     drop = coupon / 12                                  one month of coupon (30/360)
#          - price x financing / 100 x days / 360         financing the price (actual/360)
#          + (100 - price) x SMM                          principal repaid at par
#     financing (percent) = the Treasury yield at financing_tenor + financing_spread_pct
#     days = Current's settlement date to the next month's (SIFMA calendar)
#     CPR (percent a year) = cpr_floor_pct + (cpr_ceiling_pct - cpr_floor_pct) x m(gap),
#       m the S-curve in [payup_curve]: slow at discount coupons, fast at premiums
#     SMM (monthly prepayment, decimal) = 1 - (1 - CPR / 100) ^ (1/12)
#   e.g. UMBS 30 6.0 on 2026-11-25: price 98.80, 35 days, financing 4.27%, CPR about
#   12.7%: 0.500 - 0.410 + 0.014 = 0.104 points, "0-03+". A drop can be negative on
#   low coupons when financing costs more than the coupon earns.
#   KNOWN SIMPLIFICATION: scheduled principal (about 0.1% a month) is left out;
#   only prepayments repay at par. Pay-ups do not change by month.
#   ALL NUMBERS ILLUSTRATIVE; the CPR range and financing spread have no recorded
#   source. The 1-month bill yield comes from the same Treasury feed.
# -----------------------------------------------------------------------------

[drop]
financing_tenor = "1M"
financing_spread_pct = 0.0
cpr_floor_pct = 6.0
cpr_ceiling_pct = 25.0

# -----------------------------------------------------------------------------
# SIFMA settlement calendar (Step 6b)
# BUSINESS: TBAs settle once a month on dates SIFMA publishes for each class, two
#   business days after the 48-hour notification date, when the seller tells the
#   buyer which pools it will deliver. Current is the first month whose
#   notification date is today or later (New York date): the day after a class's
#   notification date its pools are allocated, so the desk quotes the next month.
#   Source: SIFMA, "MBS Notification and Settlement Dates" (updated for 2027),
#   https://www.sifma.org/resources/general/mbs-notification-and-settlement-dates/
#   (docs/public-sources.md). Copied from SIFMA's spreadsheet; Class D (ARMs,
#   balloons, multifamily) is not used.
#   min_months_ahead: a test fails when fewer months than this remain, the
#   reminder to copy in SIFMA's next year (from about October 2027).
# TECH: "YYYY-MM" = { notification = date, settlement = date } with TOML's
#   native dates. app/pricing/settlement.py checks months are consecutive and each
#   notification comes before its settlement.
# -----------------------------------------------------------------------------

[settlement]
min_months_ahead = 3


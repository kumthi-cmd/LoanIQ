# =============================================================================
# api.toml: limits for the LoanIQ loan API (backend/app/main.py).
#
# BUSINESS: the grid shows the tape one page at a time. These numbers decide how
#   big a page can be and how fast it must arrive so the desk never waits on the
#   screen. ALL NUMBERS ARE ILLUSTRATIVE engineering choices, not industry rules.
# TECH: TOML, read with Python's built-in tomllib. Times in milliseconds,
#   sizes in loans (rows).
# =============================================================================

[paging]
# TECH: rows returned when the caller does not send ?limit=
default_limit = 100
# TECH: the most rows one request can return. Bigger requests are capped here,
#   so one call can never pull the whole tape into the browser.
max_limit = 500

[performance]
# TECH: one page of /api/loans from a 50,000-loan tape must come back faster than
#   this. tests/test_api.py checks it.
page_budget_ms = 300
timing_tape_loans = 50000
# TECH: the Loan Tape screen's panels (/api/loans/breakdowns) and desk-question
#   counts (/api/loans/questions) on the same 50,000-loan tape must each come back
#   faster than this. Illustrative, like the page budget.
panels_budget_ms = 300

[breakdowns]
# BUSINESS: the "Note rate distribution" panel groups loans into note-rate buckets
#   and shows the current UPB in each. A desk reads coupons in half points, so the
#   buckets are 0.5 percentage points wide: 2.0-2.5%, 2.5-3.0%, ... ILLUSTRATIVE
#   display choices, not industry rules.
# TECH: all three in percent. A bucket includes its lower edge and excludes its
#   upper edge (6.000 is in 6.0-6.5). Loans below first_bucket_low fall into the
#   first bucket, and loans at or above last_bucket_low into the last ("9.0%+"),
#   so every loan lands in exactly one bucket. (last - first) must be a whole
#   number of widths; main.py checks it at start-up.
note_rate_bucket_width = 0.5
note_rate_first_bucket_low = 2.0
note_rate_last_bucket_low = 9.0

# BUSINESS: the "MBA delinquency" panel lists the statuses in this order, from
#   least to most severe as a desk reads them (MBA method, docs/public-sources.md).
#   A status in this list with no loans still shows, with 0. Current is the first
#   entry and is shown as the headline line, not as a bar.
# TECH: a status on the tape that is missing here is still counted, after these.
dq_status_order = ["Current", "30", "60", "90", "120+", "FC", "REO", "BK"]

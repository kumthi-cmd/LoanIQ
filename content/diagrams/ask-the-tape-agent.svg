<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
  <!--
    content/diagrams/ask-the-tape-agent.svg: the Ask the Tape agent loop and who does what.

    Where it sits: content/diagrams/ -> content.ts (agentDiagramUrl) -> AgentExplainer
    popover, opened from the Agent mark in the sidebar and beside the screen title.

    BUSINESS: a visitor sees in one picture that Claude plans and explains, LoanIQ's
      code checks every step, and the numbers come from DuckDB, not from the model.
      The steps match content/agent.md "How it works" (1 to 5).
    TECH: shown as an <img> (with alt text from content/ask-the-tape.json), so it can't
      read the page's CSS variables. Colours are the app's tokens copied as hex
      (frontend/src/styles.css): bg #0b111b, panel #0f1724, panel-2 #152033,
      border #22304a, text #d7dee9, muted #8a97ab, accent #4c9aff,
      Neural Gold #f2b705, Flask Blue #2563eb, Slate #9fb3cc. The "Tools" title uses a
      lighter Flask Blue (#6e9bf5), because #2563eb text is too dark to read on navy.
      Text is real <text>, in the system font, so it stays sharp at any size.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97ab"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2b705"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #d7dee9; }
    .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #8a97ab; }
    .title { font-size: 13px; font-weight: 600; }
    .sub { font-size: 10.5px; fill: #8a97ab; }
    .num { font-size: 10.5px; font-weight: 700; }
    .lane-title { font-size: 12.5px; font-weight: 600; }
    .lane-text { font-size: 11px; fill: #d7dee9; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 10px; fill: #9fb3cc; }
  </style>

  <rect width="720" height="420" rx="10" fill="#0b111b"/>

  <!-- BUSINESS: the loop, steps 1 to 5 of content/agent.md. -->
  <text x="20" y="26" class="eyebrow">THE LOOP</text>

  <!-- 1 Question -->
  <rect x="20" y="42" width="130" height="62" rx="8" fill="#0f1724" stroke="#22304a"/>
  <text x="32" y="62" class="num" fill="#8a97ab" style="fill:#8a97ab">1</text>
  <text x="85" y="70" class="title" text-anchor="middle">Question</text>
  <text x="85" y="88" class="sub" text-anchor="middle">plain English</text>

  <!-- 2 Claude plans -->
  <rect x="190" y="42" width="130" height="62" rx="8" fill="#152033" stroke="#f2b705" stroke-width="1.5"/>
  <text x="202" y="62" class="num" style="fill:#f2b705">2</text>
  <text x="255" y="70" class="title" text-anchor="middle">Claude plans</text>
  <text x="255" y="88" class="sub" text-anchor="middle">picks the next tool</text>

  <!-- 3 Guardrails -->
  <rect x="360" y="42" width="130" height="62" rx="8" fill="#152033" stroke="#4c9aff" stroke-width="1.5"/>
  <text x="372" y="62" class="num" style="fill:#4c9aff">3</text>
  <text x="425" y="70" class="title" text-anchor="middle">Guardrails</text>
  <text x="425" y="88" class="sub" text-anchor="middle">orchestrator checks</text>

  <!-- 4 Tool on DuckDB -->
  <rect x="530" y="42" width="170" height="62" rx="8" fill="#152033" stroke="#2563eb" stroke-width="1.5"/>
  <text x="542" y="62" class="num" style="fill:#2563eb">4</text>
  <text x="615" y="70" class="title" text-anchor="middle">Tool on DuckDB</text>
  <text x="615" y="88" class="sub" text-anchor="middle">read-only query</text>

  <!-- TECH: forward arrows 1 -> 2 -> 3 -> 4. -->
  <line x1="150" y1="73" x2="188" y2="73" stroke="#8a97ab" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="73" x2="358" y2="73" stroke="#8a97ab" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="73" x2="528" y2="73" stroke="#8a97ab" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BUSINESS: the result goes back to Claude, which repeats until it can answer. -->
  <path d="M615,104 V146 H290 V106" fill="none" stroke="#8a97ab" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="452" y="166" class="sub" text-anchor="middle">result back: totals and the first 20 rows</text>
  <text x="452" y="181" class="sub" text-anchor="middle" style="fill:#d7dee9">repeat until Claude can answer</text>

  <!-- 5 Answer with SQL -->
  <path d="M220,104 V190" fill="none" stroke="#f2b705" stroke-width="1.5" marker-end="url(#arrow-gold)"/>
  <rect x="140" y="192" width="190" height="56" rx="8" fill="#0f1724" stroke="#f2b705" stroke-width="1.5"/>
  <text x="152" y="210" class="num" style="fill:#f2b705">5</text>
  <text x="235" y="216" class="title" text-anchor="middle">Answer with SQL</text>
  <text x="235" y="234" class="sub" text-anchor="middle">every row on screen</text>

  <!-- BUSINESS: who does what, one lane each, coloured like the loop above. -->
  <line x1="20" y1="268" x2="700" y2="268" stroke="#22304a"/>
  <text x="20" y="290" class="eyebrow">WHO DOES WHAT</text>

  <!-- Claude -->
  <rect x="20" y="302" width="158" height="100" rx="8" fill="#0f1724" stroke="#22304a"/>
  <rect x="20" y="302" width="4" height="100" fill="#f2b705"/>
  <text x="34" y="324" class="lane-title" style="fill:#f2b705">Claude</text>
  <text x="34" y="344" class="lane-text">Plans each step and</text>
  <text x="34" y="359" class="lane-text">explains the result.</text>
  <text x="34" y="374" class="lane-text">Never does the math,</text>
  <text x="34" y="389" class="lane-text">never sees the tape.</text>

  <!-- Orchestrator -->
  <rect x="194" y="302" width="158" height="100" rx="8" fill="#0f1724" stroke="#22304a"/>
  <rect x="194" y="302" width="4" height="100" fill="#4c9aff"/>
  <text x="208" y="324" class="lane-title" style="fill:#4c9aff">Orchestrator</text>
  <text x="208" y="344" class="lane-text">LoanIQ's code. Runs</text>
  <text x="208" y="359" class="lane-text">the loop, checks every</text>
  <text x="208" y="374" class="lane-text">call, enforces row,</text>
  <text x="208" y="389" class="lane-text">time and cost limits.</text>

  <!-- Tools -->
  <rect x="368" y="302" width="158" height="100" rx="8" fill="#0f1724" stroke="#22304a"/>
  <rect x="368" y="302" width="4" height="100" fill="#2563eb"/>
  <text x="382" y="324" class="lane-title" style="fill:#6e9bf5">Tools</text>
  <text x="382" y="344" class="lane-text">Do every calculation:</text>
  <text x="382" y="360" class="mono">query_tape</text>
  <text x="382" y="374" class="mono">summarize_tape, get_loan</text>
  <text x="382" y="388" class="mono">list_columns, lookup_term</text>

  <!-- DuckDB -->
  <rect x="542" y="302" width="158" height="100" rx="8" fill="#0f1724" stroke="#22304a"/>
  <rect x="542" y="302" width="4" height="100" fill="#9fb3cc"/>
  <text x="556" y="324" class="lane-title" style="fill:#9fb3cc">DuckDB</text>
  <text x="556" y="344" class="lane-text">The single source of</text>
  <text x="556" y="359" class="lane-text">truth: the synthetic</text>
  <text x="556" y="374" class="lane-text">loan tape, read-only.</text>
</svg>
